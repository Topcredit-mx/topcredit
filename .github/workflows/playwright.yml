name: E2E

'on':
  push:

env:
  PLAYWRIGHT_SHARD_COUNT: 2

permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write
  pages: write

concurrency:
  group: playwright-neon-${{ github.repository }}
  cancel-in-progress: true

jobs:
  neon-create-branches:
    name: Neon branches
    runs-on: ubuntu-latest
    environment: testing
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - id: short_sha
        run: echo "short_sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch (one per Playwright shard)
        id: create-branch
        uses: neondatabase/create-branch-action@6.3.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: test-${{ steps.short_sha.outputs.short_sha }}-${{ matrix.shard }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_type: schema-only

      - name: Package connection string for Chromium
        env:
          DB_URL: ${{ steps.create-branch.outputs.db_url }}
        run: |
          set -euo pipefail
          test -n "${DB_URL}"
          printf '%s' "${DB_URL}" > database_url.txt

      - name: Upload Neon DB URL for this shard
        uses: actions/upload-artifact@v7
        with:
          name: e2e-neon-db-url-${{ matrix.shard }}
          path: database_url.txt
          retention-days: 2

  test:
    name: Chromium
    needs:
      - neon-create-branches
    runs-on: ubuntu-latest
    environment: testing
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      PW_WORKERS: 2
      PW_BLOB_REPORT: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Download Neon connection string
        uses: actions/download-artifact@v8
        with:
          name: e2e-neon-db-url-${{ matrix.shard }}
          path: neon-db

      - name: Load DATABASE_URL
        run: |
          set -euo pipefail
          printf 'DATABASE_URL=' >> "$GITHUB_ENV"
          cat neon-db/database_url.txt >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate E2E OTP code
        id: e2e-otp
        run: echo "code=$(shuf -i 100000-999999 -n 1)" >> "$GITHUB_OUTPUT"

      - name: Start app (next dev)
        run: pnpm dev &
        env:
          E2E_OTP_CODE: ${{ steps.e2e-otp.outputs.code }}

      - name: Wait for app
        run: pnpm dlx wait-on http://127.0.0.1:3000 --timeout 120000 --strict

      - name: Run Playwright tests
        id: playwright
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ env.PLAYWRIGHT_SHARD_COUNT }}
        env:
          E2E_OTP_CODE: ${{ steps.e2e-otp.outputs.code }}
          NODE_NO_WARNINGS: "1"
          TERM: xterm

      - name: Write E2E completion marker (shard ran Playwright to completion)
        if: always() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure')
        run: echo ok > "e2e-completed-shard-${{ matrix.shard }}.txt"

      - name: Upload E2E completion marker
        if: always() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: e2e-completed-shard-${{ matrix.shard }}
          path: e2e-completed-shard-${{ matrix.shard }}.txt
          retention-days: 2

      - name: Prefix blob zips (avoid merge name collisions)
        if: always()
        run: |
          shopt -s nullglob
          for f in blob-report/*.zip; do
            mv "$f" "blob-report/shard-${{ matrix.shard }}-$(basename "$f")"
          done

      - name: Upload blob report (for HTML + Pages)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test-results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 14

  playwright-report-gate:
    name: Report gate
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Download E2E completion markers
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: e2e-gate
          pattern: e2e-completed-shard-*
          merge-multiple: true

      - name: Require all shards ran Playwright (not cancelled / not failed before tests)
        id: check
        env:
          EXPECT_SHARDS: ${{ env.PLAYWRIGHT_SHARD_COUNT }}
        run: |
          set -euo pipefail
          if [ ! -d e2e-gate ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(find e2e-gate -type f | wc -l | tr -d ' ')
          if [ "$n" -eq "${EXPECT_SHARDS}" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-playwright-report:
    name: Pages
    needs:
      - test
      - playwright-report-gate
    if: ${{ !cancelled() && needs.playwright-report-gate.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all shard blob reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: downloaded-blob-reports
          pattern: blob-report-shard-*
          merge-multiple: true

      - name: Merge report to HTML
        id: merge
        run: |
          rm -rf blob-report
          mkdir -p blob-report
          n=$(find downloaded-blob-reports -name '*.zip' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" = "0" ]; then
            echo "no_blobs=1" >> "$GITHUB_OUTPUT"
            echo "No blob zips; skipping merge."
            exit 0
          fi
          find downloaded-blob-reports -name '*.zip' -type f -exec cp -t blob-report/ {} +
          pnpm exec playwright merge-reports blob-report --reporter=html
          echo "no_blobs=0" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.merge.outputs.no_blobs == '0'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.merge.outputs.no_blobs == '0'
        uses: actions/deploy-pages@v5

      - name: Job summary
        if: always()
        run: |
          echo "## Playwright HTML report" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.merge.outputs.no_blobs }}" = "1" ] || [ -z "${{ steps.merge.outputs.no_blobs }}" ]; then
            echo "No report to publish (no blob zips from the test run)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published: **${{ steps.deploy.outputs.page_url }}**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This page updates on each push. Failures and passes both appear in the report." >> "$GITHUB_STEP_SUMMARY"
          fi

  neon-delete-branches:
    name: Purge Neon shard
    needs:
      - test
    if: always()
    runs-on: ubuntu-latest
    environment: testing
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - id: short_sha
        run: echo "short_sha=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"

      - name: Delete Neon test branch
        run: |
          branch="test-${{ steps.short_sha.outputs.short_sha }}-${{ matrix.shard }}"
          npm i -g neonctl@v2
          echo "Deleting ${branch}..."
          neonctl branches delete "${branch}" --project-id "${NEON_PROJECT_ID}" || true
