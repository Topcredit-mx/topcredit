name: E2E

'on':
  push:
    branches: [main]

concurrency:
  group: playwright-main-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PLAYWRIGHT_SHARD_COUNT: 2

permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write
  pages: write

jobs:
  wait-production-migrate:
    name: Wait for Production migrate (same SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const sha = context.sha;
            const pollMs = 15000;
            const maxWaitMs = 30 * 60 * 1000;
            const start = Date.now();

            while (Date.now() - start < maxWaitMs) {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/actions/workflows/{workflow_id}/runs',
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: 'migrate.yml',
                  head_sha: sha,
                  per_page: 10,
                },
              );

              const run = data.workflow_runs.find(
                (r) => r.event === 'push' && r.head_branch === 'main',
              );

              if (!run) {
                console.log('No Production run yet for this SHA; waiting…');
                await new Promise((r) => setTimeout(r, pollMs));
                continue;
              }

              if (run.status === 'completed') {
                if (run.conclusion === 'success') {
                  console.log('Production migrate completed successfully.');
                  return;
                }
                core.setFailed(
                  `Production workflow completed with conclusion: ${run.conclusion}`,
                );
                return;
              }

              console.log(`Production status: ${run.status}`);
              await new Promise((r) => setTimeout(r, pollMs));
            }

            core.setFailed('Timed out waiting for Production migrate');

  Playwright:
    needs: wait-production-migrate
    uses: ./.github/workflows/playwright-base.yml
    secrets: inherit
    with:
      neon_secrets_environment: staging
