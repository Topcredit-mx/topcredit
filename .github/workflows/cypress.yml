name: Cypress Tests

on: [push]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  test:
    name: Cypress Tests
    runs-on: ubuntu-latest
    environment: testing
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3, 4]
    # BLOB_READ_WRITE_TOKEN is required for application document upload E2E tests; the suite will fail without it.
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Cypress binary
        uses: actions/cache@v5
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package.json', 'pnpm-lock.yaml') }}
          restore-keys: cypress-${{ runner.os }}-

      - name: Install Cypress binary
        run: pnpm exec cypress install

      - name: Extract short commit hash
        id: short-sha
        run: echo "short_sha=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Create Neon Branch
        id: create-branch
        uses: neondatabase/create-branch-action@v6.3.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: test-${{ steps.short-sha.outputs.short_sha }}-${{ matrix.containers }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_type: schema-only

      - name: Generate E2E OTP code
        id: e2e-otp
        run: echo "code=$(shuf -i 100000-999999 -n 1)" >> $GITHUB_OUTPUT

      - name: Start app (next dev)
        run: pnpm dev &
        env:
          E2E_OTP_CODE: ${{ steps.e2e-otp.outputs.code }}
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}

      - name: Wait for app
        run: pnpm dlx wait-on http://localhost:3000 --timeout 120000 --strict

      - name: Cypress run (Sorry Cypress via cypress-cloud)
        run: |
          pnpm exec cypress-cloud \
            --browser electron \
            --parallel \
            --record \
            --cloud-config-file currents.config.cjs \
            --group e2e \
            --ci-build-id "${{ github.repository }}-${{ github.run_id }}-${{ github.run_attempt }}" \
            --key "${CURRENTS_RECORD_KEY}"
        env:
          E2E_OTP_CODE: ${{ steps.e2e-otp.outputs.code }}
          DATABASE_URL: ${{ steps.create-branch.outputs.db_url }}
          CURRENTS_API_URL: ${{ secrets.SORRY_CYPRESS_DIRECTOR_URL }}
          CURRENTS_RECORD_KEY: ${{ secrets.CURRENTS_RECORD_KEY }}
          CURRENTS_PROJECT_ID: qv8a5k
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_NO_WARNINGS: 1
          TERM: xterm

      - name: Delete neon branch
        if: always()
        uses: neondatabase/delete-branch-action@v3.2.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: test-${{ steps.short-sha.outputs.short_sha }}-${{ matrix.containers }}
          api_key: ${{ secrets.NEON_API_KEY }}