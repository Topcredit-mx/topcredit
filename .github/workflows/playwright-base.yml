name: E2E base

'on':
  workflow_call:
    inputs:
      neon_secrets_environment:
        description: GitHub Environment for Neon API keys (staging on main, testing on branches)
        required: true
        type: string

env:
  PLAYWRIGHT_SHARD_COUNT: 2

permissions:
  contents: read
  pull-requests: read
  actions: read
  id-token: write
  pages: write

jobs:
  neon-create-branches:
    name: Create DB Branch
    runs-on: ubuntu-latest
    environment: ${{ inputs.neon_secrets_environment }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - id: sha
        run: echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Create Neon branch (one per Playwright shard)
        id: create-branch
        uses: neondatabase/create-branch-action@v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: test-${{ steps.sha.outputs.short_sha }}-${{ matrix.shard }}
          api_key: ${{ secrets.NEON_API_KEY }}
          branch_type: schema-only

      - name: Package connection string for Chromium
        env:
          DB_URL: ${{ steps.create-branch.outputs.db_url }}
        run: |
          set -euo pipefail
          test -n "${DB_URL}"
          printf '%s' "${DB_URL}" > database_url.txt

      - name: Upload Neon DB URL for this shard
        uses: actions/upload-artifact@v7
        with:
          name: e2e-neon-db-url-${{ matrix.shard }}
          path: database_url.txt
          retention-days: 2

  test:
    name: Chromium
    needs:
      - neon-create-branches
    runs-on: ubuntu-latest
    environment: testing
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      PW_WORKERS: 2
      PW_BLOB_REPORT: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      - name: Download Neon connection string
        uses: actions/download-artifact@v8
        with:
          name: e2e-neon-db-url-${{ matrix.shard }}
          path: neon-db

      - name: Load DATABASE_URL
        run: |
          set -euo pipefail
          printf 'DATABASE_URL=' >> "$GITHUB_ENV"
          cat neon-db/database_url.txt >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate E2E OTP code
        id: e2e-otp
        run: echo "code=$(shuf -i 100000-999999 -n 1)" >> "$GITHUB_OUTPUT"

      - name: Start app (next dev)
        run: pnpm dev &
        env:
          E2E_OTP_CODE: ${{ steps.e2e-otp.outputs.code }}

      - name: Wait for app
        run: pnpm dlx wait-on http://127.0.0.1:3000 --timeout 120000 --strict

      - name: Run Playwright tests
        id: playwright
        run: pnpm exec playwright test --shard=${{ matrix.shard }}/${{ env.PLAYWRIGHT_SHARD_COUNT }}
        env:
          E2E_OTP_CODE: ${{ steps.e2e-otp.outputs.code }}
          NODE_NO_WARNINGS: "1"
          TERM: xterm

      - name: Write E2E completion marker (shard ran Playwright to completion)
        if: always() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure')
        run: echo ok > "e2e-completed-shard-${{ matrix.shard }}.txt"

      - name: Pick changed video comparison ref
        id: changed-videos-base
        if: always() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure')
        env:
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"
          if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "${zero_sha}" ]; then
            git fetch --no-tags --depth=1 origin "${BEFORE_SHA}" || git fetch --no-tags --depth=50 origin "${REF_NAME}"
            echo "base_ref=${BEFORE_SHA}" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin main
            echo "base_ref=origin/main" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage changed Playwright videos artifact
        if: always() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure')
        run: |
          pnpm playwright:changed-videos \
            --base-ref "${{ steps.changed-videos-base.outputs.base_ref }}" \
            --artifact-dir changed-playwright-videos \
            --output changed-playwright-videos/summary.md

      - name: Upload changed Playwright videos
        if: always() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: changed-playwright-videos-${{ github.run_id }}-${{ matrix.shard }}
          path: changed-playwright-videos/
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload E2E completion marker
        if: always() && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure')
        uses: actions/upload-artifact@v7
        with:
          name: e2e-completed-shard-${{ matrix.shard }}
          path: e2e-completed-shard-${{ matrix.shard }}.txt
          retention-days: 2

      - name: Prefix blob zips (avoid merge name collisions)
        if: always()
        run: |
          shopt -s nullglob
          for f in blob-report/*.zip; do
            mv "$f" "blob-report/shard-${{ matrix.shard }}-$(basename "$f")"
          done

      - name: Upload blob report (for HTML + Pages)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: blob-report-shard-${{ matrix.shard }}
          path: blob-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload test-results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ github.run_id }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore

  playwright-report-gate:
    name: OK to publish report
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Download E2E completion markers
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: e2e-gate
          pattern: e2e-completed-shard-*
          merge-multiple: true

      - name: Require all shards ran Playwright (not cancelled / not failed before tests)
        id: check
        env:
          EXPECT_SHARDS: ${{ env.PLAYWRIGHT_SHARD_COUNT }}
        run: |
          set -euo pipefail
          if [ ! -d e2e-gate ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(find e2e-gate -type f | wc -l | tr -d ' ')
          if [ "$n" -eq "${EXPECT_SHARDS}" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy-playwright-report:
    name: Upload Test Report
    needs:
      - test
      - playwright-report-gate
    if: ${{ !cancelled() && needs.playwright-report-gate.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download all shard blob reports
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          path: downloaded-blob-reports
          pattern: blob-report-shard-*
          merge-multiple: true

      - name: Merge report to HTML
        id: merge
        run: |
          rm -rf blob-report
          mkdir -p blob-report
          n=$(find downloaded-blob-reports -name '*.zip' -type f 2>/dev/null | wc -l | tr -d ' ')
          if [ "$n" = "0" ]; then
            echo "no_blobs=1" >> "$GITHUB_OUTPUT"
            echo "No blob zips; skipping merge."
            exit 0
          fi
          find downloaded-blob-reports -name '*.zip' -type f -exec cp -t blob-report/ {} +
          pnpm exec playwright merge-reports blob-report --reporter=html
          echo "no_blobs=0" >> "$GITHUB_OUTPUT"

      - name: Upload Pages artifact
        if: steps.merge.outputs.no_blobs == '0'
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.merge.outputs.no_blobs == '0'
        uses: actions/deploy-pages@v5

      - name: Job summary
        if: always()
        run: |
          echo "## Playwright HTML report" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.merge.outputs.no_blobs }}" = "1" ] || [ -z "${{ steps.merge.outputs.no_blobs }}" ]; then
            echo "No report to publish (no blob zips from the test run)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published: **${{ steps.deploy.outputs.page_url }}**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "This page updates on each push. Failures and passes both appear in the report." >> "$GITHUB_STEP_SUMMARY"

  post-changed-playwright-videos-pr-comment:
    name: Post changed Playwright videos on PR
    needs: test
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Download changed video summaries (shard artifacts)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: changed-playwright-videos-${{ github.run_id }}-1
          path: changed-videos-shards/shard-1

      - name: Download changed video summaries (shard 2)
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: changed-playwright-videos-${{ github.run_id }}-2
          path: changed-videos-shards/shard-2

      - name: Upsert PR comment with merged summary
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const marker = '<!-- playwright-changed-videos-bot -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const pr = prs.find((p) => p.state === 'open');
            if (!pr) {
              core.info('No open PR for this commit; skipping comment.');
              return;
            }

            function readSummary(shardDir) {
              const candidates = [
                path.join(shardDir, 'changed-playwright-videos', 'summary.md'),
                path.join(shardDir, 'summary.md'),
              ];
              for (const p of candidates) {
                try {
                  return fs.readFileSync(p, 'utf8');
                } catch {
                  /* try next */
                }
              }
              return null;
            }

            const s1 = readSummary('changed-videos-shards/shard-1');
            const s2 = readSummary('changed-videos-shards/shard-2');
            if (s1 === null && s2 === null) {
              core.info('No changed-playwright-videos summaries found; skipping comment.');
              return;
            }

            function sanitizeForPrComment(md) {
              return md
                .replace(
                  /<video\s+src="([^"]*)"\s*><\/video>/gi,
                  (_m, src) =>
                    `(\`${String(src).replace(/`/g, "'")}\` — unpack the workflow artifact ZIP to play)`,
                )
                .replace(/\r\n/g, '\n');
            }

            const parts = [];
            if (s1 !== null) {
              parts.push('### Shard 1 (Chromium)\n\n' + sanitizeForPrComment(s1));
            }
            if (s2 !== null) {
              parts.push('### Shard 2 (Chromium)\n\n' + sanitizeForPrComment(s2));
            }

            const body =
              marker +
              '\n## Changed Playwright videos\n\n' +
              `Workflow run: ${runUrl}\n\n` +
              `Download artifacts **changed-playwright-videos-${context.runId}-1** and **…-2** from this run for the \`.webm\` files (GitHub does not embed video in PR comments).\n\n` +
              '---\n\n' +
              parts.join('\n\n---\n\n');

            const maxLen = 65000;
            const trimmed =
              body.length > maxLen ? body.slice(0, maxLen) + '\n\n_(truncated)_' : body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: trimmed,
              });
              core.info(`Updated comment ${existing.id} on PR #${pr.number}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: trimmed,
              });
              core.info(`Created comment on PR #${pr.number}`);
            }

  neon-delete-branches:
    name: Delete DB Branch
    needs:
      - test
    if: always()
    runs-on: ubuntu-latest
    environment: ${{ inputs.neon_secrets_environment }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}

      - id: sha
        run: echo "short_sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Delete Neon test branch
        continue-on-error: true
        uses: neondatabase/delete-branch-action@v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: test-${{ steps.sha.outputs.short_sha }}-${{ matrix.shard }}
          api_key: ${{ secrets.NEON_API_KEY }}
